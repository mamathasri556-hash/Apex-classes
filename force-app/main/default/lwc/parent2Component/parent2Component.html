<template>
    <lightning-card title="parent Component">

            <div class="slds-p-left_large">
                <p>Contact name:{showingContact.name}</p> 
                <p>phone :{showingContact.phone}</p>
                <p>Email :{showingContact.email}</p>
            </div>
        </template> 
        <c-child2component
         onshowcontact={handleContactDetail}>
        </c-child2component> 
    </lightning-card>
</template>
